version: '3.8'

networks:
  presto-network:
    driver: bridge

services:
  presto-coordinator:
    container_name: presto-coordinator
    image: prestodb/presto:latest
    ports:
      - 8080:8080
    volumes:
      - ./presto/etc:/opt/presto-server/etc
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    networks:
      - presto-network


  rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - 8181:8181
    volumes:
      - catalog-data:/catalog
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_URI: jdbc:postgresql://postgres:5432/metastore_db
    networks:
      - presto-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: postgres
    hostname: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: metastore_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d metastore_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - presto-network

  minio:
    image: minio/minio
    hostname: minio
    container_name: minio
    ports:
      - 9000:9000  # <-- CRITICAL DIFFERENTIAL FIX: Binds the S3 API to your Mac host interface
      - 9090:9090  # Console UI binding
      - 8443:9091  # Management TLS binding
    volumes:
      - minio-data:/data
    environment:
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_DOMAIN: minio
# --- CRITICAL RECTIFICATION: STRIP CERTS DIR TO FORCE PLAIN HTTP ---
    command: server /data --console-address ":9090"    
    networks:
      presto-network:
        aliases:
          - warehouse.minio
  
  mc:
    image: minio/mc
    container_name: mc
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9090 minio minio123) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;
      /usr/bin/mc policy set public minio/warehouse;
      tail -f /dev/null
      "
    networks:
      - presto-network
    depends_on:
      - minio

  ontop:
    image: ontop/ontop:latest
    container_name: ontop-vkg
    ports:
      - "8082:8080"
    environment:
      ONTOP_JAVA_ARGS: "-Dlogging.level.it.unibz.inf.ontop=DEBUG"
    volumes:
      - ./ontop/presto.properties:/opt/ontop/input/presto.properties
      - ./ontop/triplestore.obda:/opt/ontop/input/triplestore.obda
      - ./ontop/jdbc/presto-jdbc.jar:/opt/ontop/jdbc/presto-jdbc.jar
    command: >
      ontop endpoint 
      --properties=/opt/ontop/input/presto.properties 
      --mapping=/opt/ontop/input/triplestore.obda 
      --port=8080
    depends_on:
      - presto-coordinator
    networks:
      - presto-network

volumes:
  minio-data:
  catalog-data:
  postgres-data: